# ── General ────────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # true color support

set -g mouse on
set -g detach-on-destroy off
set -g history-limit 10000
set -g base-index 1           # start window numbering at 1
setw -g pane-base-index 1     # start pane numbering at 1
set -g renumber-windows on    # renumber windows when one is closed

# Reduce escape-time for neovim
set -sg escape-time 10

# Focus events for neovim autoread
set -g focus-events on

# ── Prefix ─────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Key bindings ───────────────────────────────────────────────────────────────
# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Open a project by name (prefix + o)
bind o command-prompt -p "Project:" "run-shell '$HOME/.local/bin/ide-open %1 >/dev/null'"

# Intuitive splits (open in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with capital letters
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Status bar ─────────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 30
set -g status-right-length 60

set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#585b70]│ "
set -g status-right "#[fg=#585b70]│ #[fg=#a6e3a1]%H:%M #[fg=#585b70]│ #[fg=#89b4fa]%Y-%m-%d "

setw -g window-status-format         "#[fg=#585b70] #I:#W "
setw -g window-status-current-format "#[fg=#cdd6f4,bold,bg=#313244] #I:#W "

# ── Pane borders ───────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# ── Session persistence ─────────────────────────────────────────────────────────
# Save the active session name so WezTerm can restore it on next launch
set-hook -g client-attached        'run-shell "mkdir -p ~/.local/share/tmux && echo #{session_name} > ~/.local/share/tmux/last-session"'
set-hook -g client-session-changed 'run-shell "mkdir -p ~/.local/share/tmux && echo #{session_name} > ~/.local/share/tmux/last-session"'

# ── Plugins (TPM) ──────────────────────────────────────────────────────────────
# Install TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Install plugins: prefix + I
# Update plugins:  prefix + U

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # persist sessions across reboots
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save sessions

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
# Restore neovim sessions (requires vim-obsession or similar)
set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'
