# Tmuxinator project template — copy and rename for each project.
# Place in ~/.config/tmuxinator/<project-name>.yml
# Start with: tmuxinator start <project-name>
# Stop with:  tmuxinator stop <project-name>
#
# Window layout for this IDE:
#   editor  — left pane: yazi sidebar | right pane: neovim
#   server  — runs the dev server / debug target
#   repl    — language REPL or scratch pane

name: example
root: ~/Projects/example   # change to your project root

windows:
  - editor:
      layout: main-vertical    # large pane on right, narrow on left
      panes:
        # Left sidebar: yazi — NVIM_SERVER exported so nvr knows where to connect
        - export NVIM_SERVER=/tmp/nvim-example.sock && yazi
        # Right pane: neovim listening on the session socket
        - nvim --listen /tmp/nvim-example.sock .

  - server:
      layout: even-vertical
      panes:
        # Top pane: dev server (adjust command for your stack)
        - npm run dev
        # Bottom pane: spare — use for one-off commands, tailing logs, etc.
        - ""

  - repl:
      panes:
        # Language REPL — change to python3, irb, ghci, etc. as needed
        - node
