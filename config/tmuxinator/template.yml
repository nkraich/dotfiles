# Tmuxinator project config — generated by ide-open, lives in the project root.
# Start with: ide-open <project-name>
# Stop with:  tmuxinator stop <project-name>
#
# Window layout for this IDE:
#   editor  — left pane: yazi sidebar | right pane: neovim
#   claude  — Claude Code

name: PROJECT_NAME
root: ~/Projects/PROJECT_NAME

windows:
  - editor:
      layout: even-horizontal  # 50/50 split left and right
      panes:
        # Left sidebar: yazi — NVIM_SERVER exported so nvr knows where to connect
        - export NVIM_SERVER=/tmp/nvim-PROJECT_NAME.sock && yazi
        # Right pane: neovim listening on the session socket
        - nvim --listen /tmp/nvim-PROJECT_NAME.sock .

  - claude:
      panes:
        - claude
