# Tmuxinator project for ~/Projects/website
# Place in ~/.config/tmuxinator/website.yml
# Start with: tmuxinator start website
# Stop with:  tmuxinator stop website
#
# Window layout:
#   editor  — left pane: yazi sidebar | right pane: neovim
#   server  — dev server + spare pane
#   repl    — shell scratch pane
#   claude  — Claude Code session

name: website
root: ~/Projects/website

windows:
  - editor:
      layout: even-horizontal  # 50/50 split left and right
      panes:
        # Left sidebar: yazi — NVIM_SERVER exported so nvr knows where to connect
        - export NVIM_SERVER=/tmp/nvim-website.sock && yazi
        # Right pane: neovim listening on the session socket
        - nvim --listen /tmp/nvim-website.sock .

  - server:
      layout: even-vertical
      panes:
        # Top pane: dev server
        - npm run dev
        # Bottom pane: spare — use for one-off commands, tailing logs, etc.
        - null

  - repl:
      panes:
        # Shell scratch pane
        - null

  - claude:
      panes:
        - claude
