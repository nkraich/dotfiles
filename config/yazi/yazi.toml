[[plugin.prepend_fetchers]]
id    = "git"
group = "git"
url   = "*"
run   = "git"

[[plugin.prepend_fetchers]]
id    = "git"
group = "git"
url   = "*/"
run   = "git"

[mgr]
ratio          = [1, 3, 0]   # sidebar:current:preview column widths (0 = hidden)
sort_by        = "alphabetical"
sort_dir_first = true
show_hidden    = false
show_symlink   = true

[preview]
max_width  = 1000
max_height = 1000

[opener]
# Open files in the neovim server running in the adjacent tmux pane.
# $NVIM_SERVER is set per-session by tmuxinator (see tmuxinator/<project>.yml).
# block = false keeps yazi active while the file is open in neovim.
edit = [
  { run = 'nvr --servername "$NVIM_SERVER" --remote %s', block = false, for = "unix" },
]

[open]
rules = [
  # Directories — open in yazi (default)
  { url = "*/", use = ["edit"] },

  # Text and code files — open in neovim
  { mime = "text/*",                use = ["edit"] },
  { mime = "application/json",      use = ["edit"] },
  { mime = "application/toml",      use = ["edit"] },
  { mime = "application/xml",       use = ["edit"] },
  { mime = "application/javascript",use = ["edit"] },
  { mime = "application/typescript",use = ["edit"] },

  # Images — use the system viewer
  { mime = "image/*", use = ["open"] },

  # Catch-all — try to open in neovim first
  { mime = "*", use = ["edit"] },
]
